name: ETL validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Validate catalog records
        run: python tools/validate_catalog.py --data-dir catalog
      - name: Verify deterministic catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          first="$(mktemp)"
          second="$(mktemp)"
          python -m strut_catalog_etl.build_snapshot --output "$first"
          python -m strut_catalog_etl.build_snapshot --output "$second"
          cmp "$first" "$second"
          python -m json.tool "$first" > /dev/null
          sha256sum "$first"
